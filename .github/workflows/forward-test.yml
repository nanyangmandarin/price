name: Uji maju pin bar emas H4

# Setiap hari kerja setelah New York tutup: unduh data XAUUSD 30m terbaru (Dukascopy), terapkan aturan yang
# dikunci di forward/rule-xauusd-pinbar-h4.json, lalu commit catatan ke forward/ (tambah-saja).
on:
  schedule:
    - cron: "17 23 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forward-test
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pasang dukascopy-node
        run: npm install --no-save dukascopy-node@1.51.1
      - name: Tes mesin
        run: npm test
      - name: Unduh XAUUSD 30m (sejak 2019-07, sama dengan backtest)
        run: node tools/fetch-dukascopy.js XAUUSD 2019-07-01 data/XAUUSD_M30.csv
      - name: Terapkan aturan terkunci
        run: |
          node tools/forward-test.js --data data/XAUUSD_M30.csv --rule forward/rule-xauusd-pinbar-h4.json \
            --out forward/xauusd-pinbar-h4.json --md forward/README.md
          cat forward/README.md >> "$GITHUB_STEP_SUMMARY"
      - name: Simpan catatan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward/xauusd-pinbar-h4.json forward/README.md
          if git diff --cached --quiet; then echo "Tidak ada perubahan."; exit 0; fi
          git commit -m "Uji maju: perbarui catatan pin bar emas H4"
          git push origin "HEAD:${GITHUB_REF_NAME}"
